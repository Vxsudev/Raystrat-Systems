type User @table {
  displayName: String!
  createdAt: Timestamp!
  email: String
  photoUrl: String
}

type DeviceType @table {
  name: String!
  description: String!
  createdAt: Timestamp!
  expectedDataSchema: String
}

type Device @table {
  user: User!
  deviceType: DeviceType!
  name: String!
  serialNumber: String!
  status: String!
  createdAt: Timestamp!
  location: String
  description: String
  lastHeartbeatAt: Timestamp
}

type SensorData @table {
  device: Device!
  timestamp: Timestamp!
  value: String! # Using String to store JSON for complex data
  createdAt: Timestamp!
  dataType: String
}

type Alert @table {
  device: Device!
  alertType: String!
  message: String!
  timestamp: Timestamp!
  isAcknowledged: Boolean!
  thresholdValue: String # Using String to be flexible with threshold types
  actualValue: String # Using String to be flexible with actual value types
}

type DeviceGroup @table {
  user: User!
  name: String!
  createdAt: Timestamp!
  description: String
}

type DeviceGroupMembership @table(key: ["device", "deviceGroup"]) {
  device: Device!
  deviceGroup: DeviceGroup!
  assignedAt: Timestamp!
}